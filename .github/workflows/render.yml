name: AI Video Renderer

on:
  repository_dispatch:
    types: [generate_video]

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-freefont-ttf
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Packages & Run Generator
        env:
          PROMPT: ${{ github.event.client_payload.prompt }}
          NARASI: ${{ github.event.client_payload.narasi }}
          VOICE_B1: ${{ github.event.client_payload.voice_b1 }}
          NARASI_B1: ${{ github.event.client_payload.narasi_b1 }}
          PROMPT2: ${{ github.event.client_payload.prompt2 }}
          NARASI2: ${{ github.event.client_payload.narasi2 }}
          VOICE: ${{ github.event.client_payload.voice }}
          ASPECT: ${{ github.event.client_payload.aspect }}
          MOTION: ${{ github.event.client_payload.motion }}
          STYLE: ${{ github.event.client_payload.style }}
          BGM: ${{ github.event.client_payload.bgm }}
          SUB_COLOR: ${{ github.event.client_payload.sub_color }}
          SUB_BG: ${{ github.event.client_payload.sub_bg }}
          LIPSYNC: ${{ github.event.client_payload.lipsync }}
          RESOLUTION: ${{ github.event.client_payload.resolution }}
          WATERMARK: ${{ github.event.client_payload.watermark }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests edge-tts "Pillow<10.0.0" moviepy==1.0.3
          python render_script.py

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: video-result
          path: output.mp4
