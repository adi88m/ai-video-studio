name: AI Video Renderer

on:
  repository_dispatch:
    types: [generate_video]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages & Run Generator
        env:
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python -m pip install --upgrade pip
          pip install requests edge-tts moviepy==1.0.3 pillow imageio-ffmpeg numpy scipy
          python render_script.py

      - name: Commit & Push Rendered Video
        if: always()
        run: |
          # Buat nama file unik berdasarkan timestamp agar tidak tertimpa cache
          FILENAME="video_${{ github.run_id }}.mp4"
          cp output_video.mp4 $FILENAME
          
          # Tulis URL media langsung
          MEDIA_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/$FILENAME"
          echo "{\"status\": \"success\", \"url\": \"$MEDIA_URL\"}" > result.json
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add $FILENAME result.json
          git commit -m "Add rendered video $FILENAME [skip ci]" || exit 0
          git push
