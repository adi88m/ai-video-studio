name: AI Video Renderer

on:
  repository_dispatch:
    types: [generate_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install requests gTTS moviepy==1.1.3

      - name: Run Video Generator
        env:
          PROMPT: ${{ github.event.client_payload.prompt }}
          NARASI: ${{ github.event.client_payload.narasi }}
        run: |
          python render_script.py

      - name: Upload Output Video
        uses: actions/upload-artifact@v4
        with:
          name: video-result
          path: output.mp4
