<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Studio Pro v3.0 Ultimate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background: var(--bg-main); 
      color: var(--text-main); 
      min-height: 100vh; 
      padding: clamp(8px, 2vw, 24px); 
    }

    .container { 
      width: 100%; 
      max-width: 1200px; 
      margin: 0 auto; 
    }

    .header { 
      text-align: center; 
      margin-bottom: 20px; 
    }
    
    .badge { 
      display: inline-block; 
      padding: 4px 12px; 
      background: rgba(99, 102, 241, 0.15); 
      border: 1px solid rgba(99, 102, 241, 0.3); 
      border-radius: 20px; 
      color: #818cf8; 
      font-size: clamp(10px, 1.5vw, 12px); 
      font-weight: 600; 
      margin-bottom: 6px; 
    }
    
    h1 { 
      font-size: clamp(20px, 4vw, 32px); 
      font-weight: 800; 
    }

    .card { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px); 
      border: 1px solid var(--card-border); 
      padding: clamp(12px, 3vw, 24px); 
      border-radius: 16px; 
      margin-bottom: 16px; 
      width: 100%;
    }

    .grid-2 { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 12px; 
    }

    @media (min-width: 640px) {
      .grid-2 { 
        grid-template-columns: repeat(2, 1fr); 
      }
    }

    .form-group { 
      margin-bottom: 12px; 
      width: 100%;
    }

    label { 
      font-weight: 600; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px; 
      font-size: clamp(12px, 1.5vw, 13px); 
      color: #cbd5e1; 
    }

    input[type="text"], input[type="password"], textarea, select { 
      width: 100%; 
      padding: 12px; 
      background: rgba(15, 23, 42, 0.6); 
      border: 1px solid var(--card-border); 
      border-radius: 8px; 
      color: var(--text-main); 
      font-family: inherit; 
      font-size: clamp(12px, 1.5vw, 14px); 
      outline: none; 
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus, textarea:focus, select:focus {
      border-color: var(--primary);
    }

    select option { 
      background: #1e293b; 
      color: #fff; 
    }

    .section-title { 
      font-size: clamp(13px, 1.8vw, 15px); 
      font-weight: 700; 
      color: #818cf8; 
      margin-bottom: 12px; 
      border-bottom: 1px solid var(--card-border); 
      padding-bottom: 6px; 
      margin-top: 14px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn { 
      width: 100%; 
      background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%); 
      color: #fff; 
      border: none; 
      padding: 14px; 
      font-size: clamp(14px, 2vw, 16px); 
      font-weight: 700; 
      border-radius: 10px; 
      cursor: pointer; 
      transition: opacity 0.2s; 
    }

    .btn:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
    }

    .btn-small { 
      background: rgba(99, 102, 241, 0.2); 
      border: 1px solid #6366f1; 
      color: #a5b4fc; 
      padding: 4px 10px; 
      font-size: 11px; 
      border-radius: 6px; 
      cursor: pointer; 
      white-space: nowrap;
    }

    .btn-download { 
      display: block; 
      width: 100%; 
      text-align: center; 
      background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
      color: #fff; 
      text-decoration: none; 
      padding: 14px; 
      font-size: 15px; 
      font-weight: 700; 
      border-radius: 10px; 
      margin-top: 12px; 
      box-sizing: border-box; 
    }

    .status-box { 
      display: none; 
      margin-top: 14px; 
      padding: 14px; 
      border-radius: 10px; 
      background: rgba(99, 102, 241, 0.1); 
      text-align: center; 
      font-size: 13px; 
      color: #a5b4fc; 
      border: 1px solid rgba(99, 102, 241, 0.2); 
      line-height: 1.5; 
      word-break: break-word;
    }

    .progress-bar-container { 
      width: 100%; 
      background: rgba(255, 255, 255, 0.1); 
      height: 8px; 
      border-radius: 4px; 
      overflow: hidden; 
      margin-top: 10px; 
      display: none; 
    }

    .progress-bar { 
      width: 0%; 
      height: 100%; 
      background: linear-gradient(90deg, #6366f1, #10b981); 
      transition: width 1s linear; 
    }

    .video-container { 
      display: none; 
      margin-top: 18px; 
      text-align: center; 
    }

    video { 
      width: 100%; 
      max-height: 550px; 
      border-radius: 12px; 
      border: 1px solid var(--card-border); 
      background: #000; 
      object-fit: contain;
    }

    .template-bar { 
      display: flex; 
      gap: 8px; 
      margin-bottom: 14px; 
      overflow-x: auto; 
      padding-bottom: 6px; 
      -webkit-overflow-scrolling: touch;
    }

    .btn-template { 
      background: rgba(255,255,255,0.05); 
      border: 1px solid var(--card-border); 
      color: #cbd5e1; 
      padding: 6px 14px; 
      border-radius: 20px; 
      font-size: 12px; 
      cursor: pointer; 
      white-space: nowrap; 
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge">AI VIDEO STUDIO v3.0 ULTIMATE</span>
      <h1>AI Video Generator Studio</h1>
      <p style="color:var(--text-muted); font-size:13px; margin-top:4px;">Lip-Sync, Dialog Multi-Character, & Templat Cerita</p>
    </div>

    <!-- TEMPLAT CERITA -->
    <div class="template-bar">
      <button class="btn-template" onclick="applyTemplate('horor')">👻 Templat Horor</button>
      <button class="btn-template" onclick="applyTemplate('edukasi')">💡 Templat Edukasi</button>
      <button class="btn-template" onclick="applyTemplate('dialog')">🗣️ Templat Dialog 2 Orang</button>
    </div>

    <div class="card">
      <!-- INPUT TOKEN PAT SECURE -->
      <div class="form-group" style="background: rgba(99, 102, 241, 0.1); padding: 12px; border-radius: 8px; border: 1px dashed #6366f1; margin-bottom: 16px;">
        <label style="color: #a5b4fc;">🔑 GitHub Fine-Grained Token (PAT)</label>
        <input type="password" id="userTokenInput" placeholder="github_pat_11AAAAAAA_xxxxxxxx..." onchange="saveTokenLocally()">
        <span style="font-size: 11px; color: #94a3b8; margin-top: 4px; display: block;">Token disimpan secara lokal di browser Anda untuk menghindari kebocoran Secret Scanning.</span>
      </div>

      <div class="section-title">⚙️ Konfigurasi Video & Audio</div>
      <div class="grid-2">
        <div class="form-group">
          <label>
            🗣️ Suara Karakter A
            <button class="btn-small" onclick="previewVoice()">🔊 Tes Suara</button>
          </label>
          <select id="voiceInput">
            <option value="id-ID-ArdiNeural">Pria (Indonesia)</option>
            <option value="id-ID-GadisNeural">Wanita (Indonesia)</option>
            <option value="jv-ID-DimasNeural">Pria (Jawa)</option>
            <option value="su-ID-JajangNeural">Pria (Sunda)</option>
            <option value="en-US-GuyNeural">Pria (English US)</option>
          </select>
        </div>
        <div class="form-group">
          <label>🎨 Style Visual</label>
          <select id="styleInput">
            <option value="cinematic">Cinematic 3D Realistis</option>
            <option value="anime">Anime / Manga Style</option>
            <option value="cyberpunk">Cyberpunk / Sci-Fi</option>
            <option value="horror">Horror / Dark Atmosphere</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>📺 Resolusi Video</label>
          <select id="resInput">
            <option value="720p">720p HD (Render Cepat)</option>
            <option value="1080p">1080p Full HD</option>
          </select>
        </div>
        <div class="form-group">
          <label>🎵 Musik Latar (BGM)</label>
          <select id="bgmInput">
            <option value="none">Tanpa Musik</option>
            <option value="ambient">Ambient Cinematic</option>
            <option value="epic">Epic Dramatic</option>
            <option value="horror">Eerie Horror</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>📐 Aspek Rasio</label>
          <select id="aspectInput">
            <option value="9:16">Vertical 9:16 (Shorts/Reels)</option>
            <option value="16:9">Horizontal 16:9 (YouTube)</option>
          </select>
        </div>
        <div class="form-group">
          <label>👄 Lip-Sync Character AI</label>
          <select id="lipsyncInput">
            <option value="false">Nonaktif (Gambar Statis)</option>
            <option value="true">Aktifkan Lip-Sync Animation</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>🏷️ Watermark Username (Opsional)</label>
        <input type="text" id="watermarkInput" placeholder="Contoh: @adi88m_studio">
      </div>

      <!-- ADEGAN 1 -->
      <div class="section-title">
        🎥 Adegan 1
        <button class="btn-small" onclick="enhancePrompt(1)">✨ Auto Enhance</button>
      </div>
      <div class="form-group">
        <label>✨ Prompt Visual 1</label>
        <input type="text" id="promptInput" value="candi kuno di tengah hutan misterius malam hari">
      </div>
      <div class="form-group">
        <label>📖 Narasi Karakter A</label>
        <textarea id="narasiInput" rows="2">Dia berjalan menyusuri tempat suci yang telah lama terlupakan.</textarea>
      </div>

      <!-- DIALOG KARAKTER B -->
      <div class="grid-2">
        <div class="form-group">
          <label>🗣️ Suara Karakter B (Dialog)</label>
          <select id="voiceB1Input">
            <option value="">-- Tanpa Karakter B --</option>
            <option value="id-ID-GadisNeural">Wanita (Indonesia)</option>
            <option value="id-ID-ArdiNeural">Pria (Indonesia)</option>
          </select>
        </div>
        <div class="form-group">
          <label>📖 Narasi Karakter B</label>
          <input type="text" id="narasiB1Input" placeholder="Balasan dialog Karakter B...">
        </div>
      </div>

      <!-- ADEGAN 2 -->
      <div class="section-title">
        🎥 Adegan 2 (Opsional)
        <button class="btn-small" onclick="enhancePrompt(2)">✨ Auto Enhance</button>
      </div>
      <div class="form-group">
        <label>✨ Prompt Visual 2</label>
        <input type="text" id="prompt2Input" placeholder="Contoh: gerbang emas terbuka memancarkan cahaya">
      </div>
      <div class="form-group">
        <label>📖 Narasi Cerita 2</label>
        <textarea id="narasi2Input" rows="2" placeholder="Contoh: Dan rahasia besar itu terungkap di depan matanya."></textarea>
      </div>

      <button class="btn" id="renderBtn" onclick="triggerGitHubRender()">⚡ Render AI Video v3.0</button>
      
      <div id="statusTxt" class="status-box"></div>
      <div id="progressContainer" class="progress-bar-container">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="videoBox" class="video-container">
        <video id="videoPlayer" controls autoplay loop playsinline></video>
        <a id="downloadBtn" class="btn-download" href="#" target="_blank" download="ai-video.mp4">📥 Download Video MP4</a>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USERNAME = "adi88m";               
    const GITHUB_REPO     = "ai-video-studio"; 

    window.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem("STUDIO_PAT_TOKEN");
      if (savedToken) {
        document.getElementById('userTokenInput').value = savedToken;
      }
    });

    function saveTokenLocally() {
      const tokenVal = document.getElementById('userTokenInput').value.trim();
      if (tokenVal) {
        localStorage.setItem("STUDIO_PAT_TOKEN", tokenVal);
      }
    }

    function previewVoice() {
      const narasi = document.getElementById('narasiInput').value || "Ini adalah contoh suara AI.";
      const utterance = new SpeechSynthesisUtterance(narasi);
      utterance.lang = "id-ID";
      window.speechSynthesis.speak(utterance);
    }

    function applyTemplate(type) {
      if (type === 'horor') {
        document.getElementById('styleInput').value = 'horror';
        document.getElementById('bgmInput').value = 'horror';
        document.getElementById('promptInput').value = 'rumah tua terbengkalai di tengah hutan berkabut malam hari, sangat seram';
        document.getElementById('narasiInput').value = 'Jangan pernah datang ke tempat ini setelah tengah malam...';
      } else if (type === 'edukasi') {
        document.getElementById('styleInput').value = 'cinematic';
        document.getElementById('bgmInput').value = 'ambient';
        document.getElementById('promptInput').value = 'planet bumi dilihat dari luar angkasa dengan cahaya matahari sinematik 8k';
        document.getElementById('narasiInput').value = 'Tahukah kamu, tata surya kita menyimpan ribuan misteri yang belum terungkap.';
      } else if (type === 'dialog') {
        document.getElementById('promptInput').value = 'detektif berbicara dengan pria misterius di kafe gelap sinematik';
        document.getElementById('narasiInput').value = 'Apakah kamu membawa dokumen rahasia itu?';
        document.getElementById('voiceB1Input').value = 'id-ID-GadisNeural';
        document.getElementById('narasiB1Input').value = 'Tentu saja, tapi ada harganya.';
      }
    }

    function enhancePrompt(sceneIdx) {
      const field = sceneIdx === 1 ? document.getElementById('promptInput') : document.getElementById('prompt2Input');
      if (!field.value.trim()) return alert("Isi prompt dasar terlebih dahulu!");
      
      const enhancerMap = [
        " hyperrealistic, dramatic lighting, highly detailed 8k",
        " masterpiece, trending on artstation, unreal engine 5 render",
        " vivid color palette, volumetric light, epic fantasy style"
      ];
      field.value += enhancerMap[Math.floor(Math.random() * enhancerMap.length)];
    }

    async function triggerGitHubRender() {
      const GITHUB_TOKEN = document.getElementById('userTokenInput').value.trim() || localStorage.getItem("STUDIO_PAT_TOKEN");

      if (!GITHUB_TOKEN) {
        alert("Harap masukkan Token PAT GitHub Anda terlebih dahulu!");
        return;
      }

      saveTokenLocally();

      const prompt = document.getElementById('promptInput').value.trim();
      const narasi = document.getElementById('narasiInput').value.trim();
      const voice_b1 = document.getElementById('voiceB1Input').value;
      const narasi_b1 = document.getElementById('narasiB1Input').value.trim();

      const prompt2 = document.getElementById('prompt2Input').value.trim();
      const narasi2 = document.getElementById('narasi2Input').value.trim();
      
      const voice = document.getElementById('voiceInput').value;
      const aspect = document.getElementById('aspectInput').value;
      const motion = "zoom_in";
      const style = document.getElementById('styleInput').value;
      const bgm = document.getElementById('bgmInput').value;
      const lipsync = document.getElementById('lipsyncInput').value;
      const resolution = document.getElementById('resInput').value;
      const watermark = document.getElementById('watermarkInput').value.trim();

      const status = document.getElementById('statusTxt');
      const renderBtn = document.getElementById('renderBtn');
      const videoBox = document.getElementById('videoBox');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');

      if (!prompt || !narasi) {
        alert("Harap isi prompt dan narasi untuk Adegan 1!");
        return;
      }

      status.style.display = "block";
      progressContainer.style.display = "block";
      progressBar.style.width = "5%";
      videoBox.style.display = "none";
      renderBtn.disabled = true;
      status.innerHTML = "⏳ Mengirim sinyal & konfigurasi ke server cloud...";

      const payloadData = {
        prompt: prompt,
        narasi: narasi,
        voice: voice,
        aspect: aspect,
        style: style,
        bgm: bgm,
        lipsync: lipsync,
        extra: JSON.stringify({
          voice_b1, narasi_b1, prompt2, narasi2, motion, resolution, watermark
        })
      };

      try {
        const response = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${GITHUB_TOKEN}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            event_type: 'generate_video',
            client_payload: payloadData
          })
        });

        if (response.ok) {
          status.innerHTML = "🔄 <b>Server sedang merender video v3.0...</b><br>Estimasi waktu: 60-90 detik.";
          startProgressBar();
          checkWorkflowStatus(GITHUB_TOKEN);
        } else {
          const errorDetail = await response.json().catch(() => ({ message: "Tidak ada rincian pesan error" }));
          status.innerHTML = `❌ <b>Gagal Memicu (HTTP Status: ${response.status})</b><br><small style="color:#f87171">Pesan Server: ${errorDetail.message || 'Unknown'}</small>`;
          renderBtn.disabled = false;
          progressContainer.style.display = "none";
        }
      } catch (err) {
        status.innerHTML = "❌ Terjadi kesalahan koneksi: " + err.message;
        renderBtn.disabled = false;
        progressContainer.style.display = "none";
      }
    }

    function startProgressBar() {
      const progressBar = document.getElementById('progressBar');
      let currentWidth = 5;
      const timer = setInterval(() => {
        if (currentWidth < 90) {
          currentWidth += 1.5;
          progressBar.style.width = currentWidth + "%";
        } else {
          clearInterval(timer);
        }
      }, 1000);
    }

    async function checkWorkflowStatus(token) {
      const status = document.getElementById('statusTxt');
      const renderBtn = document.getElementById('renderBtn');
      const videoBox = document.getElementById('videoBox');
      const videoPlayer = document.getElementById('videoPlayer');
      const downloadBtn = document.getElementById('downloadBtn');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');

      const interval = setInterval(async () => {
        try {
          // Ambil status workflow terbaru
          const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/actions/runs?per_page=1`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          const latestRun = data.workflow_runs[0];

          if (latestRun && latestRun.status === "completed") {
            clearInterval(interval);
            renderBtn.disabled = false;

            if (latestRun.conclusion === "success") {
              // MEKANISME REAL-TIME: Ambil langsung dari GitHub Contents API untuk menembus CDN Cache
              try {
                const fileApiRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/result.json?t=${new Date().getTime()}`, {
                  headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                  }
                });

                if (fileApiRes.ok) {
                  const fileApiData = await fileApiRes.json();
                  const decodedContent = decodeURIComponent(escape(atob(fileApiData.content)));
                  const jsonParsed = JSON.parse(decodedContent);

                  if (jsonParsed.url && jsonParsed.url.startsWith("http")) {
                    showSuccessVideo(jsonParsed.url);
                    return;
                  }
                }
              } catch(e) {
                console.error("Gagal baca via API Contents:", e);
              }

              // Fallback Raw CDN jika API gagal
              try {
                const rawRes = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/result.json?nocache=${Math.random()}`);
                if (rawRes.ok) {
                  const rawJson = await rawRes.json();
                  if (rawJson.url && rawJson.url.startsWith("http")) {
                    showSuccessVideo(rawJson.url);
                    return;
                  }
                }
              } catch(e) {}

              status.innerHTML = "⚠️ Video selesai dirender, namun link belum dapat dibaca. Coba tekan F5 / Refresh.";
            } else {
              status.innerHTML = "❌ Rendering gagal di server. Silakan cek log di repositori.";
            }
            progressContainer.style.display = "none";
          }
        } catch (e) {
          console.error(e);
        }
      }, 7000);

      function showSuccessVideo(url) {
        progressBar.style.width = "100%";
        setTimeout(() => { progressContainer.style.display = "none"; }, 1000);
        status.innerHTML = "✅ <b>Rendering Selesai!</b> Video kamu siap diputar dan diunduh.";
        videoPlayer.src = url;
        downloadBtn.href = url;
        videoBox.style.display = "block";
      }
    }
  </script>
</body>
</html>
