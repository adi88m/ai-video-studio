<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Studio Pro v3.0 Ultimate</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg-main: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --card-border: rgba(255, 255, 255, 0.08); --primary: #6366f1; --text-main: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 16px; }
    .container { width: 100%; max-width: 800px; margin: 0 auto; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); padding: 20px; border-radius: 16px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    label { font-weight: 600; display: block; margin-bottom: 6px; font-size: 13px; color: #cbd5e1; }
    input[type="text"], input[type="password"], textarea, select { width: 100%; padding: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); outline: none; }
    .btn { width: 100%; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: #fff; border: none; padding: 14px; font-weight: 700; border-radius: 10px; cursor: pointer; }
    .btn:disabled { opacity: 0.5; }
    .btn-download { display: block; width: 100%; text-align: center; background: #10b981; color: #fff; text-decoration: none; padding: 14px; font-weight: 700; border-radius: 10px; margin-top: 12px; }
    .status-box { display: none; margin-top: 14px; padding: 14px; border-radius: 10px; background: rgba(99, 102, 241, 0.1); text-align: center; font-size: 13px; color: #a5b4fc; }
    .video-container { display: none; margin-top: 18px; }
    video { width: 100%; max-height: 500px; border-radius: 12px; background: #000; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2 style="margin-bottom:16px; text-align:center; color:#818cf8;">⚡ AI Video Studio Pro v3.0</h2>
      
      <div class="form-group">
        <label>🔑 GitHub PAT Token</label>
        <input type="password" id="userTokenInput" placeholder="github_pat_11AAA...">
      </div>

      <div class="form-group">
        <label>🎨 Style Visual & Mood Suara</label>
        <select id="styleInput">
          <option value="horror">Horror (Suara Mencekam & Berat)</option>
          <option value="cinematic" selected>Cinematic (Suara Sinematik Standar)</option>
          <option value="cyberpunk">Cyberpunk (Suara Tempo Cepat)</option>
        </select>
      </div>

      <div class="form-group">
        <label>✨ Prompt Visual Adegan 1</label>
        <input type="text" id="promptInput" value="candi kuno di tengah hutan misterius malam hari">
      </div>
      <div class="form-group">
        <label>📖 Narasi Karakter A</label>
        <textarea id="narasiInput" rows="2">Dia berjalan menyusuri tempat suci yang telah lama terlupakan.</textarea>
      </div>

      <div class="form-group">
        <label>✨ Prompt Visual Adegan 2 (Opsional)</label>
        <input type="text" id="prompt2Input" placeholder="gerbang emas terbuka memancarkan cahaya">
      </div>
      <div class="form-group">
        <label>📖 Narasi Cerita 2</label>
        <textarea id="narasi2Input" rows="2" placeholder="Dan rahasia besar itu terungkap di depan matanya."></textarea>
      </div>

      <button class="btn" id="renderBtn" onclick="triggerGitHubRender()">⚡ Render AI Video v3.0</button>
      <div id="statusTxt" class="status-box"></div>

      <div id="videoBox" class="video-container">
        <video id="videoPlayer" controls autoplay loop playsinline></video>
        <a id="downloadBtn" class="btn-download" href="#" target="_blank" download="video.mp4">📥 Download Video MP4</a>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USERNAME = "adi88m";               
    const GITHUB_REPO     = "ai-video-studio"; 

    async function triggerGitHubRender() {
      const token = document.getElementById('userTokenInput').value.trim();
      if (!token) return alert("Harap masukkan Token PAT GitHub!");

      const renderBtn = document.getElementById('renderBtn');
      const status = document.getElementById('statusTxt');
      const videoBox = document.getElementById('videoBox');

      renderBtn.disabled = true;
      videoBox.style.display = "none";
      status.style.display = "block";
      status.innerHTML = "⏳ Mengirim sinyal ke server GitHub...";

      const payload = {
        prompt: document.getElementById('promptInput').value.trim(),
        narasi: document.getElementById('narasiInput').value.trim(),
        style: document.getElementById('styleInput').value,
        prompt2: document.getElementById('prompt2Input').value.trim(),
        narasi2: document.getElementById('narasi2Input').value.trim(),
        voice: "id-ID-ArdiNeural",
        aspect: "9:16"
      };

      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/dispatches`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ event_type: 'generate_video', client_payload: payload })
        });

        if (res.ok) {
          status.innerHTML = "🔄 <b>Server sedang merender video sinematik baru...</b><br>Tunggu sekitar 60 detik.";
          pollResult(token);
        } else {
          status.innerHTML = "❌ Gagal memicu server. Periksa Token PAT.";
          renderBtn.disabled = false;
        }
      } catch (err) {
        status.innerHTML = "❌ Error: " + err.message;
        renderBtn.disabled = false;
      }
    }

    async function pollResult(token) {
      const status = document.getElementById('statusTxt');
      const renderBtn = document.getElementById('renderBtn');
      const videoBox = document.getElementById('videoBox');
      const videoPlayer = document.getElementById('videoPlayer');
      const downloadBtn = document.getElementById('downloadBtn');

      const startTime = new Date().getTime();

      const interval = setInterval(async () => {
        try {
          // Permintaan API diberi timestamp (?t=...) agar TIDAK TER-CACHE BROWSER
          const res = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/actions/runs?per_page=1&t=${new Date().getTime()}`, {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          const data = await res.json();
          const latestRun = data.workflow_runs[0];

          // Pastikan workflow run yang dibaca adalah run yang dibuat SETELAH klik tombol render
          if (latestRun && new Date(latestRun.created_at).getTime() >= startTime) {
            if (latestRun.status === "completed") {
              clearInterval(interval);
              renderBtn.disabled = false;

              if (latestRun.conclusion === "success") {
                const resultRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/result.json?t=${new Date().getTime()}`, {
                  headers: { 'Authorization': `Bearer ${token}` }
                });
                const resultData = await resultRes.json();
                const jsonContent = JSON.parse(decodeURIComponent(escape(atob(resultData.content))));

                status.innerHTML = "✅ <b>Rendering Selesai!</b> Video baru siap diputar.";
                
                // Paksa pemutar video memuat URL baru tanpa cache
                videoPlayer.src = jsonContent.url + "?cache_buster=" + new Date().getTime();
                downloadBtn.href = jsonContent.url;
                videoBox.style.display = "block";
              } else {
                status.innerHTML = "❌ Render gagal di server. Cek log tab Actions.";
              }
            }
          }
        } catch (e) { console.error(e); }
      }, 6000);
    }
  </script>
</body>
</html>
